<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReLoop - Authentication Portal</title>
    <meta name="description" content="Centralized Authentication Portal for Buyers and Suppliers.">
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; justify-content: center; align-items: center; padding: 20px;">

    <!-- Interactive User-Controlled 3D Constellation Mesh Background Canvas -->
    <canvas id="reloop-dither-bg"></canvas>

    <!-- UNIFIED LOGIN CARD CONTAINER -->
    <div class="reloop-card" style="width: 100%; max-width: 490px; padding: 40px; text-align: center; border-color: var(--border-color); box-shadow: 0 0 50px rgba(0, 255, 192, 0.35); backdrop-filter: blur(16px);">
        
        <!-- Brand Title -->
        <a href="index.html" style="text-decoration: none; display: inline-flex; align-items: center; gap: 12px; margin-bottom: 12px;">
            <span style="font-size: 38px;">♻️</span>
            <div style="font-family: var(--font-heading); font-size: 32px; font-weight: 800; color: #FFF;">Re<span style="color: var(--primary-mint);">Loop</span></div>
        </a>

        <div style="margin-bottom: 24px;">
            <span class="badge badge-verified" id="portal-role-badge" style="font-size: 13px; padding: 6px 16px;">🔐 BUYER PORTAL LOGIN</span>
        </div>

        <!-- Role Selector Tabs: Buyer vs Supplier -->
        <div style="display: flex; gap: 8px; margin-bottom: 24px; background: rgba(4, 9, 18, 0.7); padding: 5px; border-radius: 14px; border: 1px solid rgba(0, 255, 192, 0.2);">
            <button id="role-buyer-tab" class="btn btn-buyer btn-sm" style="flex: 1;" onclick="switchRole('buyer')">🛒 Buyer Login</button>
            <button id="role-supplier-tab" class="btn btn-outline btn-sm" style="flex: 1; border: none; color: var(--text-muted);" onclick="switchRole('supplier')">🏭 Supplier Login</button>
        </div>

        <!-- Quick Demo Fill Credentials Buttons -->
        <div id="demo-buyer-btn-wrapper" style="margin-bottom: 22px;">
            <button class="btn btn-outline btn-full" style="border-color: #38BDF8; color: #38BDF8;" onclick="fillDemoBuyer()">
                ⚡ Fill Demo Buyer Credentials (buyer@eco.com)
            </button>
        </div>

        <div id="demo-supplier-btn-wrapper" style="margin-bottom: 22px; display: none;">
            <button class="btn btn-outline btn-full" style="border-color: #10B981; color: #10B981;" onclick="fillDemoSupplier()">
                ⚡ Fill Demo Supplier Credentials (supplier@eco.com)
            </button>
        </div>

        <!-- AUTHENTICATION FORM -->
        <form onsubmit="handleAuthSubmit(event)">
            <div class="form-group" style="text-align: left;">
                <label class="form-label" id="email-label">Buyer Email Address</label>
                <input type="email" id="auth-email" class="form-control" placeholder="buyer@eco.com" required>
            </div>

            <div class="form-group" style="text-align: left;">
                <label class="form-label">Password</label>
                <input type="password" id="auth-password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" id="submit-btn" class="btn btn-buyer btn-full" style="font-size: 16px; padding: 14px; margin-bottom: 16px;">
                🚀 Login to Buyer Portal
            </button>
        </form>

        <div style="margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
            <a href="index.html" style="color: var(--text-muted); font-size: 13px; text-decoration: none;">⬅️ Return to Main Explainer Hub</a>
        </div>
    </div>

    <script src="background.js"></script>
    <script src="motion.js"></script>
    <script>
        let currentRole = 'buyer';

        function initFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const roleParam = params.get('role');
            if (roleParam === 'supplier') {
                switchRole('supplier');
            } else {
                switchRole('buyer');
            }
        }

        function switchRole(role) {
            currentRole = role;
            const buyerTab = document.getElementById('role-buyer-tab');
            const supplierTab = document.getElementById('role-supplier-tab');
            const demoBuyer = document.getElementById('demo-buyer-btn-wrapper');
            const demoSupplier = document.getElementById('demo-supplier-btn-wrapper');
            const emailLabel = document.getElementById('email-label');
            const submitBtn = document.getElementById('submit-btn');
            const roleBadge = document.getElementById('portal-role-badge');

            if (role === 'buyer') {
                buyerTab.className = 'btn btn-buyer btn-sm';
                supplierTab.className = 'btn btn-outline btn-sm';
                supplierTab.style.border = 'none';
                supplierTab.style.color = 'var(--text-muted)';
                demoBuyer.style.display = 'block';
                demoSupplier.style.display = 'none';
                emailLabel.innerText = 'Buyer Email Address';
                submitBtn.className = 'btn btn-buyer btn-full';
                submitBtn.innerText = '🚀 Login to Buyer Portal';
                document.getElementById('auth-email').placeholder = 'buyer@eco.com';
                roleBadge.innerText = '🔐 BUYER PORTAL LOGIN';
                roleBadge.className = 'badge badge-info';
            } else {
                supplierTab.className = 'btn btn-supplier btn-sm';
                buyerTab.className = 'btn btn-outline btn-sm';
                buyerTab.style.border = 'none';
                buyerTab.style.color = 'var(--text-muted)';
                demoBuyer.style.display = 'none';
                demoSupplier.style.display = 'block';
                emailLabel.innerText = 'Company / Supplier Email Address';
                submitBtn.className = 'btn btn-supplier btn-full';
                submitBtn.innerText = '🚀 Login to Supplier Portal';
                document.getElementById('auth-email').placeholder = 'supplier@eco.com';
                roleBadge.innerText = '🔐 SUPPLIER PORTAL LOGIN';
                roleBadge.className = 'badge badge-verified';
            }
        }

        function fillDemoBuyer() {
            switchRole('buyer');
            document.getElementById('auth-email').value = 'buyer@eco.com';
            document.getElementById('auth-password').value = 'password123';
        }

        function fillDemoSupplier() {
            switchRole('supplier');
            document.getElementById('auth-email').value = 'supplier@eco.com';
            document.getElementById('auth-password').value = 'password123';
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            const pass = document.getElementById('auth-password').value.trim();

            if (currentRole === 'buyer') {
                const buyerUser = {
                    id: Date.now(),
                    name: email.split('@')[0].toUpperCase() + " (Buyer)",
                    email: email,
                    role: "buyer",
                    token: "buyer_session_" + Date.now()
                };
                localStorage.setItem('reloop_active_buyer', JSON.stringify(buyerUser));
                // Clear supplier session to prevent cross-portal contamination
                localStorage.removeItem('reloop_active_supplier');
                alert('🎉 Buyer Login Successful! Redirecting to Buyer Portal...');
                window.location.href = 'buyer.html';
            } else {
                const supplierUser = {
                    id: Date.now(),
                    name: email.split('@')[0].toUpperCase() + " (Supplier)",
                    email: email,
                    role: "supplier",
                    token: "supplier_session_" + Date.now()
                };
                localStorage.setItem('reloop_active_supplier', JSON.stringify(supplierUser));
                // Clear buyer session to prevent cross-portal contamination
                localStorage.removeItem('reloop_active_buyer');
                alert('🎉 Supplier Login Successful! Redirecting to Supplier Portal...');
                window.location.href = 'supplier.html';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initFromUrl();
            if (typeof initMotionEngine === 'function') initMotionEngine();
        });
    </script>
</body>
</html>
